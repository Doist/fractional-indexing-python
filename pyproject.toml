[project]
name = "doist-fractional-indexing"
# The version comes from git tags (see [tool.hatch.version]).
dynamic = ["version"]
description = "Fractional indexing: string order keys that sort lexicographically. Doist fork, byte-for-byte compatible with rocicorp/fractional-indexing v4."
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENCE"]
authors = [
    { name = "Doist Developers", email = "dev@doist.com" },
    { name = "Jakub Roztocil", email = "jakub@httpie.io" },
]
requires-python = ">=3.8"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
GitHub = "https://github.com/Doist/fractional-indexing-python"
Upstream = "https://github.com/httpie/fractional-indexing-python"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The version comes from the v* git tags, so it isn't written in this file.
# The release workflow builds with SETUPTOOLS_SCM_PRETEND_VERSION set to the
# released version. Any other build gets a dev version after the latest tag,
# or the fallback when there's no git metadata at all.
source = "vcs"
fallback-version = "0.0.0"
# Only vX.Y.Z tags are releases. The legacy 0.1.x tags, and the tags of the
# upstream repo this one forks, must never set the version. Same pattern as
# RELEASE_TAG in release.yml.
tag-pattern = '^v(?P<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$'
raw-options = { scm = { git = { describe_command = "git describe --dirty --tags --long --match v[0-9]*.[0-9]*.[0-9]*" } } }

[tool.hatch.build.targets.wheel]
only-include = ["fractional_indexing.py"]

[tool.hatch.build.targets.sdist]
include = ["fractional_indexing.py", "tests.py", "README.md", "LICENCE"]
