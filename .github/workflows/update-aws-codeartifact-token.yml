name: Auto-update AWS_CODEARTIFACT_TOKEN secret

on:
    # CodeArtifact authorization tokens last 12 hours, so update every 4 hours (i.e., 3 tries).
    schedule:
        - cron: '0 */4 * * *'
    workflow_dispatch:

env:
  # TODO(platform): provision a CI role for this repo (like
  # doist-billist-github-user-RoleCI-* for Doist/billist) and put its ARN here.
  AWS_ROLE: arn:aws:iam::011833101604:role/REPLACE-WITH-THIS-REPOS-CI-ROLE

permissions:
    id-token: write
    contents: read

jobs:
    auto-update-codeartifact-token:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ env.AWS_ROLE }}
                  role-duration-seconds: 900
                  aws-region: us-east-1

            - name: Get CodeArtifact token
              id: aws-token
              run: |
                  token="$(aws codeartifact get-authorization-token --domain doist --domain-owner 011833101604 --query authorizationToken --output text)"
                  echo "::add-mask::$token"
                  echo "token=$token" >> $GITHUB_OUTPUT

            - name: Update repository secret
              run: |
                  gh secret set AWS_CODEARTIFACT_TOKEN -R "${{ github.repository }}" -b "${{ steps.aws-token.outputs.token }}" -a actions
                  gh secret set AWS_CODEARTIFACT_TOKEN -R "${{ github.repository }}" -b "${{ steps.aws-token.outputs.token }}" -a dependabot
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
