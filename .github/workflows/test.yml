name: Test
on: [push, pull_request]
jobs:
  test:
    # ubuntu-latest (26.04) has no setup-python builds for 3.8 or 3.9.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest tests.py --verbose
      # The tests above run without the package installed, so they only see
      # the 0.0.0 fallback. This checks the installed path reads a version.
      - name: Check the installed version
        run: |
          pip install .
          INSTALLED_VERSION=$(python -c 'import fractional_indexing; print(fractional_indexing.__version__)')
          echo "Installed version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" = "0.0.0" ]; then
            echo "::error::__version__ fell back to 0.0.0 in an installed build."
            exit 1
          fi
