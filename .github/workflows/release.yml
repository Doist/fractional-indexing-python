name: Release

# Manually-triggered release to Doist's AWS CodeArtifact index. Publishes via
# the GitHub OIDC role below; no repo secrets needed.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none releases the version already in pyproject.toml)"
        type: choice
        options: [none, patch, minor, major]
        default: patch

concurrency: deploy

env:
  AWS_ROLE: arn:aws:iam::011833101604:role/github-roles-FractionalIndexingPython-73esVaEfRRD9

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Increment version
        id: version
        run: |
          if [ "${{ inputs.bump }}" != "none" ]; then
            uv version --bump "${{ inputs.bump }}"
          fi
          echo "version=$(uv version --short)" >> $GITHUB_OUTPUT

      - name: Commit updated version
        if: ${{ inputs.bump != 'none' }}
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: "chore: bump version to ${{ steps.version.outputs.version }}"
          file_pattern: "pyproject.toml uv.lock"

      - name: Run tests
        run: uv run --group dev pytest tests.py

      - name: Build package
        run: uv build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-duration-seconds: 900
          aws-region: us-east-1

      - name: Publish package
        env:
          UV_PUBLISH_URL: https://doist-011833101604.d.codeartifact.us-east-1.amazonaws.com/pypi/doist/
          UV_PUBLISH_USERNAME: aws
        run: |
          UV_PUBLISH_PASSWORD=$(aws codeartifact get-authorization-token --domain doist --domain-owner 011833101604 --query authorizationToken --output text)
          export UV_PUBLISH_PASSWORD
          uv publish

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
