name: Release

# Manually-triggered release to Doist's AWS CodeArtifact index. Publishes via
# the GitHub OIDC role below; no repo secrets needed.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency: deploy

env:
  AWS_ROLE: arn:aws:iam::011833101604:role/github-roles-FractionalIndexingPython-73esVaEfRRD9

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check this is main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases only run from main, not $GITHUB_REF."
            exit 1
          fi

      # Full history and tags, to find the latest release tag.
      - name: Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # The version lives in the v* git tags, not in pyproject.toml. An org
      # ruleset requires every change to main to go through a signed pull
      # request, so this job can't commit a version bump. The release created
      # below tags the released commit.
      - name: Work out the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # Only tags shaped vX.Y.Z, with no leading zeros, count, which leaves
          # out the legacy 0.1.x tags. Bash would read a leading zero as octal
          # in the arithmetic below.
          RELEASE_TAG='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          LATEST_TAG=$(git tag --list 'v*' | grep -E "$RELEASE_TAG" | sort -V | tail -n 1 || true)
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No vX.Y.Z tag found."
            exit 1
          fi

          # A re-run of an older run must not release older code under a
          # newer version.
          if ! git merge-base --is-ancestor "$LATEST_TAG" "$GITHUB_SHA"; then
            echo "::error::$LATEST_TAG isn't in this commit's history. Release from the latest main instead."
            exit 1
          fi

          # Releases are manual, so a commit that already has a release has
          # nothing new to ship, whatever the bump.
          ALREADY_RELEASED=$(git tag --points-at "$GITHUB_SHA" | grep -E "$RELEASE_TAG" || true)
          if [ -n "$ALREADY_RELEASED" ]; then
            echo "::error::This commit is already released as $ALREADY_RELEASED."
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
          case "$BUMP" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            *) echo "::error::Unknown bump: $BUMP"; exit 1 ;;
          esac
          NEXT_VERSION="$MAJOR.$MINOR.$PATCH"

          # Ask the remote, in case a tag was pushed after the checkout. Exit
          # code 2 means the tag is missing; any other failure means the lookup
          # itself failed, so the check didn't happen.
          LOOKUP_STATUS=0
          git ls-remote --exit-code --tags origin "refs/tags/v$NEXT_VERSION" > /dev/null || LOOKUP_STATUS=$?
          if [ "$LOOKUP_STATUS" -eq 0 ]; then
            echo "::error::Tag v$NEXT_VERSION already exists."
            exit 1
          elif [ "$LOOKUP_STATUS" -ne 2 ]; then
            echo "::error::Could not check the remote for tag v$NEXT_VERSION."
            exit 1
          fi

          echo "Releasing $NEXT_VERSION ($BUMP bump from $LATEST_TAG)."
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: uv run --group dev pytest tests.py

      - name: Build package
        env:
          # hatch-vcs takes the version from here instead of the git tags.
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv build
          WHEEL="dist/doist_fractional_indexing-$SETUPTOOLS_SCM_PRETEND_VERSION-py3-none-any.whl"
          unzip -p "$WHEEL" '*.dist-info/METADATA' | grep -x "Version: $SETUPTOOLS_SCM_PRETEND_VERSION"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-duration-seconds: 900
          aws-region: us-east-1

      - name: Publish package
        env:
          UV_PUBLISH_URL: https://doist-011833101604.d.codeartifact.us-east-1.amazonaws.com/pypi/doist/
          UV_PUBLISH_USERNAME: aws
        run: |
          UV_PUBLISH_PASSWORD=$(aws codeartifact get-authorization-token --domain doist --domain-owner 011833101604 --query authorizationToken --output text)
          export UV_PUBLISH_PASSWORD
          uv publish

      # Creating the tag after publishing means a failed publish leaves no tag,
      # so a re-run releases the same version rather than skipping one.
      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
